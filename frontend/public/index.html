<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <link rel="icon" href="icon.png" type="image/x-icon">
  <meta charset="utf-8">
  <title>Stand Planner</title>
  <style>
    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      background-color: var(--main-background-color);
    }

    #root {
      width: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <div id="root">
  </div>
</body>

</html>
